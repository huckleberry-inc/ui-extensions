name: CI

on: [push]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: ./.github/workflows/actions/prepare

      - id: typescript-cache
        name: Restore TypeScript cache
        uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1
        with:
          path: |
            packages/*/build/ts
            packages/*/build/*.tsbuildinfo
          key: ${{ runner.os }}-typescript-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-typescript-v1-

      - name: Type check
        run: yarn type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: ./.github/workflows/actions/prepare

      - id: jest-cache
        name: Restore jest cache
        uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1
        with:
          path: .loom/cache/jest/
          key: ${{ runner.os }}-jest-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-v1-

      - name: Test
        run: yarn test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: ./.github/workflows/actions/prepare

      - id: eslint-cache
        name: Restore ESLint cache
        uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1
        with:
          path: .loom/cache/eslint
          key: ${{ runner.os }}-eslint-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-v1-

      - name: Lint
        run: yarn lint

  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: ./.github/workflows/actions/prepare

      - id: test-build
        name: Build docs locally to ensure they can be built in CI
        run: yarn docs:admin
